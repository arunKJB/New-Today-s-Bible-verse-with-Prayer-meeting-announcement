<!DOCTYPE html>
<html lang="ta">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <meta
        name="theme-color"
        content="#000000"
    >

    <meta
        name="description"
        content="இன்றைய நம்பிக்கை தரும் நல்வாக்கு"
    >

    <title>
        இன்றைய நம்பிக்கை தரும் நல்வாக்கு
    </title>


    <!-- FAVICON -->

    <link
        rel="icon"
        type="image/jpeg"
        href="assests/koinoniaKGlogo.jpg"
    >

    <link
        rel="apple-touch-icon"
        href="assests/koinoniaKGlogo.jpg"
    >


    <!-- GOOGLE FONT -->

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Noto+Sans+Tamil:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >


    <!-- BOOTSTRAP -->

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >


    <!-- YOUR CSS -->

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


    <!-- =================================================
         MAIN BACKGROUND
    ================================================== -->

    <div
        class="background"
        id="background"
    ></div>


    <!-- =================================================
         EFFECT CONTAINERS
    ================================================== -->

    <div id="bottom-flash-container"></div>

    <div id="amen-flash-container"></div>

    <div id="golden-glow"></div>


    <!-- =================================================
         TOP LOGO
    ================================================== -->

    <img
        src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTo9vJnAw9zUWALqdEMLAM23hUqinZK8O3flcWTyxQd6g&s=10"
        alt="Krishnagiri Logo"
        class="top-logo"
    >


    <!-- =================================================
         FIRST SCREEN
    ================================================== -->

    <main
        id="start-screen"
        class="page page-one active"
    >

        <div
            class="background-image image-one"
            id="firstBackground"
        ></div>


        <div
            class="page-content first-screen-content"
            id="firstScreenContent"
        >

            <img
                id="bibleImage"
                src=""
                alt="Holy Bible"
                class="bible-image"
            >


            <h1 class="main-title">

                📖 இன்றைய நம்பிக்கை தரும் நல்வாக்கு 📖

            </h1>


            <div class="screen-hint">

                <span class="hint-hand">
                    👆
                </span>

                <span>
                    Tap the Screen for Today's Word
                </span>

            </div>

        </div>

    </main>


    <!-- =================================================
         SECOND SCREEN
    ================================================== -->

    <main
        id="verse-screen"
        class="page page-two"
    >

        <div
            class="background-image image-two"
            id="dailyBackground"
        ></div>


        <div
            class="page-content second-screen-content"
        >

            <div class="verse-wrapper">


                <!-- TAMIL VERSE -->

                <section
                    class="verse-card tamil-card"
                >

                    <div
                        class="verse-reference"
                        id="tamilReference"
                    ></div>


                    <div
                        class="verse-text tamil-text"
                        id="tamilVerse"
                    ></div>

                </section>


                <!-- ENGLISH VERSE -->

                <section
                    class="verse-card english-card"
                >

                    <div
                        class="verse-reference"
                        id="englishReference"
                    ></div>


                    <div
                        class="verse-text english-text"
                        id="englishVerse"
                    ></div>


                    <!-- AMEN BUTTON -->

                    <button
                        id="amenBtn"
                        type="button"
                    >

                        💛 ஆமென்

                    </button>

                </section>


                <!-- PRAYER CARD -->

                <section class="prayer-card">

                    <h2 id="prayerTitle"></h2>

                    <p id="prayerDescription"></p>

                    <div class="prayer-details">

                        <span id="prayerDate"></span>

                        <span id="prayerTime"></span>

                        <span id="prayerPlace"></span>

                    </div>

                </section>


            </div>

        </div>

    </main>


    <!-- =================================================
         BLESSING BAR

         IMPORTANT:
         Hidden initially.
         JavaScript shows it ONLY after first tap.
    ================================================== -->

    <div
        id="blessing"
        class="final-blessing"
    >

        <div class="blessing-track">

            <span>
                ✝️ ஆண்டவர் உங்களை ஆசீர்வதிப்பாராக ✝️ MAY GOD BLESS YOU ✝️
            </span>

            <span>
                ✝️ MAY GOD BLESS YOU ✝️
            </span>

            <span>
                ✝️ ஜெப தொடர்புக்கு 📞 6379123388
            </span>

            <span>
                ✝️ ஆண்டவர் உங்களை ஆசீர்வதிப்பாராக ✝️
            </span>

            <span>
                ✝️ MAY GOD BLESS YOU ✝️
            </span>

            <span>
                ✝️ ஜெப தொடர்புக்கு 📞 6379123388
            </span>

        </div>

    </div>


    <!-- =================================================
         JAVASCRIPT
    ================================================== -->

    <script src="verses.js"></script>

    <script src="script.js"></script>


    <!-- BOOTSTRAP JS -->

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    ></script>

</body>

</html>
